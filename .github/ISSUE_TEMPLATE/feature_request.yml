---
name: Feature request
description: Suggest a new command, flag, or behaviour change
title: "[feat] "
labels: enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that da-cli currently doesn't support?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: A sketch of the command/flag/behaviour you'd like. Examples welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      description: da-cli is intentionally stdlib-only and single-file
      options:
        - label: This can be done with the Python standard library only (no new runtime dependency)
          required: true
        - label: I checked the existing issues for duplicates
          required: true
