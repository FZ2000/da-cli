# lychee link-checker config — used by the CI `link-check` (internal,
# every push/PR) and `link-check-external` (weekly) jobs.

max_concurrency = 8
timeout = 20
max_retries = 2

# Rate-limited responses are not stale links.
accept = ["200..=204", "429"]

exclude = [
    # The repo's own GitHub URLs. GitHub answers 404 to anonymous requests
    # for a private repo, so these are unverifiable — not broken — until
    # the repo is made public. REMOVE THIS ENTRY AT PUBLICATION: see
    # PUBLISHING.md. Leaving it in after going public would hide genuinely
    # dead self-links, which is exactly how the old private-host exclusion
    # let four dead CHANGELOG tag links survive.
    "^https://github\\.com/FZ2000/da-cli",
    # Loopback / redirect-URI examples in the OAuth docs.
    "^https?://(localhost|127\\.0\\.0\\.1)",
    # Placeholder domains used in config examples.
    "yoursite\\.com",
    # DA API base — endpoint URLs in docs need auth and would 401.
    "www\\.deviantart\\.com/api/",
    # Shields.io badge URLs render fine but throttle checkers hard.
    "img\\.shields\\.io",
]

# Never probe private/reserved IPs from CI.
exclude_all_private = true
